version: "3.9"

name: mlverse-x

networks:
  mlverse-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
  chromadb-data:
  ollama-data:

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mlverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlverse}
      POSTGRES_USER: ${POSTGRES_USER:-mlverse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlverse_password_change_in_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - mlverse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlverse_user} -d ${POSTGRES_DB:-mlverse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mlverse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - mlverse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mlverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlverse_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mlverse_minio_password_change_in_prod}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mlverse-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MinIO Setup ─────────────────────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: mlverse-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlverse-network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-mlverse_minio_user} ${MINIO_ROOT_PASSWORD:-mlverse_minio_password_change_in_prod};
      mc mb --ignore-existing myminio/datasets;
      mc mb --ignore-existing myminio/models;
      mc mb --ignore-existing myminio/reports;
      mc mb --ignore-existing myminio/avatars;
      mc mb --ignore-existing myminio/mlflow-artifacts;
      mc anonymous set public myminio/avatars;
      echo 'MinIO setup complete';
      "

  # ─── ChromaDB ────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: mlverse-chromadb
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - mlverse-network
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  # ─── MLflow ──────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlverse-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlverse_user}:${POSTGRES_PASSWORD:-mlverse_password_change_in_prod}@postgres:5432/mlverse_mlflow
      --artifacts-destination s3://mlflow-artifacts/
      --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mlverse_minio_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mlverse_minio_password_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - mlverse-network

  # ─── Ollama ──────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mlverse-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - mlverse-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Remove the deploy section above if you don't have a GPU

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mlverse-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_HOST: minio
      CHROMA_HOST: chromadb
      OLLAMA_HOST: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./ai:/ai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mlverse-network
    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/seed.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mlverse-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_HOST: minio
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./ai:/ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mlverse-network
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mlverse-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - mlverse-network
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ─── Flower (Celery Monitor) ─────────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mlverse-flower
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
      - celery-worker
    ports:
      - "5555:5555"
    networks:
      - mlverse-network
    command: celery -A app.workers.celery_app flower --port=5555

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mlverse-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_NAME: "MLVerse X"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mlverse-network

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mlverse-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - mlverse-network
